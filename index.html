<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개과제_강다현</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>강다현을 소개합니다</h1>
    <button id="theme-btn">🌙 다크모드</button>
  </header>

  <main class="cards">
    <article class="card">
      <img src="https://stock.adobe.com/kr/search?k=%EB%8B%AC%ED%86%A0%EB%81%BC" alt="강다현 닮은 동물">
      <h2>강다현</h2>
      <p class="role">석사과정</p>
      <p>영재교육 2학기생이고, 저는 21일차 초등교사입니다. </p>
    </article>

    <article class="card">
      <h2>관심 분야</h2>
      <p class="role">제 관심 영역은?</p>
      <p>과학영재, 과학정보융합, 화학 등</p>
    </article>

    <article class="card">
      <h2>이번 학기 목표</h2>
      <p class="role">무엇을 만들 것인가</p>
      <p>인공지능을 활용하여 코딩하는 법 배우기</p>
    </article>
  </main>

  <footer>
    <p>© 2026 강다현</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
